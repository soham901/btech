<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const arr = [10, 20, 30, 40];

      const findMax = (arr) => {
        let maxVal = arr[0];
        arr.forEach((val) => {
          if (val > maxVal) {
            maxVal = val;
          }
        });
        return maxVal;
      };

      console.log(findMax(arr));
    </script>
  </body>
</html>
